<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; 
    --fg: #1c1c1e; 
    --muted: #6b7280;
    --border: #d4d4d8; 
    --accent: #2563eb; 
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b; 
      --fg: #f4f4f5; 
      --muted: #a1a1aa;
      --border: #3f3f46; 
      --accent: #60a5fa; 
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    background: var(--bg); 
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .app { 
    max-width: 36rem; 
    margin: 0 auto; 
    padding: 2rem 1rem; 
  }
  .add-form { 
    display: flex; 
    gap: 0.5rem; 
  }
  .add-form input { 
    flex: 1; 
  }
  input[type='text'] {
    padding: 0.5rem 0.75rem; 
    border: 1px solid var(--border); 
    border-radius: 0.375rem;
    background: transparent; 
    color: inherit; 
    font: inherit;
  }
  button {
    padding: 0.5rem 0.9rem; 
    border: 1px solid var(--accent); 
    border-radius: 0.375rem;
    background: var(--accent); 
    color: #fff; 
    font: inherit; 
    cursor: pointer;
  }
  button:disabled { 
    opacity: 0.6; 
    cursor: wait; 
  }
  button.ghost { 
    background: transparent; 
    color: var(--danger); 
    border-color: transparent; 
  }
  .status { 
    min-height: 1.5rem; 
    color: var(--muted); 
    margin: 0.5rem 0; 
  }
  .status.error { 
    color: var(--danger); 
  }
  .list { 
    list-style: none; 
    margin: 0; 
    padding: 0; 
  }
  .list li {
    display: flex; 
    align-items: center; 
    gap: 0.6rem;
    padding: 0.5rem 0; 
    border-bottom: 1px solid var(--border);
  }
  .list li span { 
    flex: 1; 
  }
  .list li.done span { 
    text-decoration: line-through; 
    color: var(--muted); 
  }
</style>
